<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄金 ICT 分析</title>
<style>
:root{--bg:#F4F6FA;--card:#fff;--tx:#131A26;--sub:#5B6677;--ln:#E1E6EE;--up:#1F9D55;--dn:#D8404F}
@media(prefers-color-scheme:dark){:root{--bg:#0C1118;--card:#151C27;--tx:#E8EDF5;--sub:#8F9BAE;--ln:#232C3A;--up:#3DCB72;--dn:#F0566A}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
.w{max-width:520px;margin:auto;padding:20px 14px 40px}
h1{font-size:15px;color:var(--sub);font-weight:600}
.px{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sub{font-size:12.5px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 0;font:inherit;font-size:14px}
.seg button.on{color:var(--tx);border-color:var(--tx);font-weight:600}
svg{width:100%;height:auto;display:block;margin:10px 0 6px}
</style></head><body><div class="w">
<h1>黄金 XAU/USD（实时）</h1><div class="px" id="px">--</div><div class="sub" id="tm">连接中…</div>
<div class="card"><div class="seg" id="seg"></div><svg id="ch" viewBox="0 0 360 320"></svg><div class="sub" id="st">加载K线中…</div></div>
<p class="sub" style="margin-top:12px">这一版只接入真实价格和走势图，下一版加入 ICT 形态识别。</p></div>
<script>
var TF="15m",SPOT=null,C=[],src="",KR={"5m":5,"15m":15,"1h":60};
function $(i){return document.getElementById(i)}
function get(u){var c=new AbortController();setTimeout(function(){c.abort()},10000);return fetch(u,{signal:c.signal}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function bin(h){return function(){return get("https://"+h+"/api/v3/klines?symbol=PAXGUSDT&interval="+TF+"&limit=120").then(function(j){return j.map(function(k){return{t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}})})}}
function kra(){return get("https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval="+KR[TF]).then(function(j){var k=Object.keys(j.result).filter(function(x){return x!="last"})[0];return j.result[k].slice(-120).map(function(a){return{t:a[0]*1000,o:+a[1],h:+a[2],l:+a[3],c:+a[4]}})})}
var SRC=[["Binance",bin("api.binance.com")],["Binance 备用",bin("data-api.binance.vision")],["Kraken",kra]];
function loadC(i){if(i>=SRC.length){$("st").textContent="所有K线来源都连不上，稍后会自动重试";return Promise.resolve()}
return SRC[i][1]().then(function(c){src=SRC[i][0];C=c;draw()}).catch(function(){return loadC(i+1)})}
function loadS(){return get("https://api.gold-api.com/price/XAU").then(function(j){SPOT=j.price;$("px").textContent=SPOT.toFixed(2);$("tm").textContent="现货价　更新于 "+new Date().toLocaleTimeString("zh-CN",{hour12:false});draw()}).catch(function(){$("tm").textContent="现货价连接失败，稍后自动重试"})}
function draw(){
if(!C.length)return;
var last=C[C.length-1].c,OFF=SPOT?SPOT-last:0,D=C.slice(-90),lo=1e9,hi=-1e9;
D.forEach(function(k){lo=Math.min(lo,k.l+OFF);hi=Math.max(hi,k.h+OFF)});
var pad=(hi-lo)*.05;lo-=pad;hi+=pad;
var W=360,H=320,R=48,n=D.length,bw=(W-R)/n,s="";
function y(p){return H-(p-lo)/(hi-lo)*H}
for(var i=0;i<=4;i++){var p=lo+(hi-lo)*i/4;s+='<line x1="0" x2="'+(W-R)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="var(--ln)"/><text x="'+(W-R+4)+'" y="'+(y(p)+4)+'" font-size="11" fill="var(--sub)">'+p.toFixed(1)+'</text>'}
D.forEach(function(k,i){var x=i*bw+bw/2,col=k.c>=k.o?"var(--up)":"var(--dn)",a=y(k.o+OFF),b=y(k.c+OFF);
s+='<line x1="'+x+'" x2="'+x+'" y1="'+y(k.h+OFF)+'" y2="'+y(k.l+OFF)+'" stroke="'+col+'"/><rect x="'+(x-bw*.35)+'" width="'+bw*.7+'" y="'+Math.min(a,b)+'" height="'+Math.max(1,Math.abs(a-b))+'" fill="'+col+'"/>'});
var ly=y(last+OFF);s+='<line x1="0" x2="'+(W-R)+'" y1="'+ly+'" y2="'+ly+'" stroke="var(--tx)" stroke-dasharray="3 3"/>';
$("ch").innerHTML=s;
$("st").textContent="K线来源："+src+"（PAXG）｜"+(SPOT?"已按现货价平移 "+(OFF>=0?"+":"")+OFF.toFixed(2):"等待现货价")}
[["5m","5分钟"],["15m","15分钟"],["1h","1小时"]].forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.className=t[0]==TF?"on":"";
b.onclick=function(){TF=t[0];C=[];$("ch").innerHTML="";$("st").textContent="加载K线中…";Array.prototype.forEach.call($("seg").children,function(x){x.className=""});b.className="on";loadC(0)};$("seg").appendChild(b)});
loadS();loadC(0);setInterval(loadS,15000);setInterval(function(){loadC(0)},30000);
</script></body></html>
